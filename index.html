function bind(){document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))$('#close').click()})}function updateClock(){document.querySelectorAll('[data-clock]').forEach(n=>{let g=state.games.get(n.dataset.clock);if(g&&live(g))n.textContent=clock(g)})}$('#close').onclick=()=>{$('#modal').classList.add('hidden');$('#player').pause();$('#player').removeAttribute('src')};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#close').click()};$('#refresh').onclick=()=>load();$('#demo').onclick=()=>{state.demo=true;demo()};async function load(){if(state.demo)return;$('#status').textContent='Syncing…';try{let data=await get(`/score/${date()}`);let arr=Array.isArray(data.games)?data.games:(data.gamesByDate?.find(x=>x.date===date())?.games||[]);let next=new Map();for(let raw of arr){let g=normalize(raw);g.id=String(g.id);let old=state.games.get(g.id);let st=normState(g);if(st==='LIVE'||st==='INTERMISSION'||st==='FINAL'){try{let l=await get(`/gamecenter/${g.id}/landing`);applyLanding(g,l);g.goals=parseGoals(l)}catch{g.goals=[]}try{let b=await get(`/gamecenter/${g.id}/boxscore`);g.box=normalizeBox(b);g.away.players=g.box.away;g.home.players=g.box.home}catch{g.box={away:[],home:[]}}}else g.goals=[];let ns=seconds(g),sameClock=old&&old.period===g.period&&clock(old)===clock(g);g.clockAnchorSeconds=sameClock?old.clockAnchorSeconds:ns;g.clockAnchorAt=sameClock?old.clockAnchorAt:Date.now();g.away.record=raw.awayTeam?.record||'';g.home.record=raw.homeTeam?.record||'';detect(g,old);next.set(String(g.id),g)}state.games=next;render();$('#status').textContent=`${next.size} games • Updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`}catch(e){console.error(e);$('#status').textContent=`DATA ERROR: ${e.message}`;render()}}function demo(){let names=[['BOS','WSH','Bruins','Capitals'],['NYR','NYI','Rangers','Islanders'],['TOR','MTL','Maple Leafs','Canadiens'],['DAL','MIN','Stars','Wild']];state.games=new Ma
